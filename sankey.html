<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOTUS Sankey</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>

<style>
      @font-face {
  font-family: "Benton";
  src: url("Benton Sans/Benton Sans Book.otf");
}

@font-face {
  font-family: "BentonStrong";
  src: url("Benton Sans/Benton Sans Bold.otf");
}

@font-face {
  font-family: "BentonMedium";
  src: url("Benton Sans/Benton Sans Medium.otf");
}

  body {
    font-family:"Benton", sans-serif;
    margin: 0;
    padding: 20px;
  }

  h2 {
    margin: 40px 0 10px;
  }

  svg {
    width: 100%;
    height: 400px;
  }

  .node rect {
    fill: #000;
    stroke: #fff;
  }

  .link {
    fill: none;
    stroke: #999;
    stroke-opacity: 0.4;
  }

  .link:hover {
    stroke-opacity: 0.7;
  }

  text {
    font-size: 12px;
    fill: #000;
  }
</style>
</head>

<body>

<h2>Issue Area → SCOTUS</h2>
<svg id="sankey-issue"></svg>

<h2>Case Origin → SCOTUS</h2>
<svg id="sankey-origin"></svg>

<script>

// FILE PATHS — update if needed
const DATA_PATH = "SCDB_combined_100years.csv";
const ISSUE_PATH = "issue_area.csv";
const ORIGIN_PATH = "case_origin_with_type.csv";

// SVG sizes
const width = 900;
const height = 400;

const svgIssue = d3.select("#sankey-issue")
  .attr("viewBox", [0, 0, width, height]);

const svgOrigin = d3.select("#sankey-origin")
  .attr("viewBox", [0, 0, width, height]);

// Sankey generator
const sankey = d3.sankey()
  .nodeWidth(15)
  .nodePadding(10)
  .extent([[1, 1], [width - 1, height - 6]]);

Promise.all([
  d3.csv(DATA_PATH),
  d3.csv(ISSUE_PATH),
  d3.csv(ORIGIN_PATH)
]).then(([data, issueLookup, originLookup]) => {

  // -----------------------------
  // BUILD LOOKUP DICTIONARIES
  // -----------------------------
  const issueMap = new Map(issueLookup.map(d => [
    +d.issue_area_code,
    d.issue_area
  ]));

  const originMap = new Map(originLookup.map(d => [
    +d.case_origin_code,
    d.court_type
  ]));

  // -----------------------------
  // AGGREGATION FUNCTION
  // -----------------------------
  function buildCounts(field, lookupMap) {
    const counts = new Map();

    data.forEach(d => {
      const code = +d[field];
      const label = lookupMap.get(code) || "Unknown";

      counts.set(label, (counts.get(label) || 0) + 1);
    });

    return counts;
  }

  // -----------------------------
  // BUILD SANKEY DATA
  // -----------------------------
  function buildSankey(counts) {

    const nodes = [];
    const links = [];

    const scotusNode = { name: "SCOTUS" };
    nodes.push(scotusNode);

    counts.forEach((value, key) => {
      nodes.push({ name: key });
      links.push({
        source: key,
        target: "SCOTUS",
        value: value
      });
    });

    return { nodes, links };
  }

  // -----------------------------
  // RENDER FUNCTION
  // -----------------------------
  function renderSankey(svg, graphData) {

    // Convert names → index references
    const nodeMap = new Map();
    graphData.nodes.forEach((d, i) => {
      nodeMap.set(d.name, i);
    });

    const sankeyInput = {
      nodes: graphData.nodes.map(d => ({ ...d })),
      links: graphData.links.map(d => ({
        source: nodeMap.get(d.source),
        target: nodeMap.get(d.target),
        value: d.value
      }))
    };

    const { nodes, links } = sankey(sankeyInput);

    // LINKS
    svg.append("g")
      .selectAll("path")
      .data(links)
      .join("path")
      .attr("class", "link")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke-width", d => Math.max(1, d.width));

    // NODES
    const node = svg.append("g")
      .selectAll("g")
      .data(nodes)
      .join("g")
      .attr("class", "node");

    node.append("rect")
      .attr("x", d => d.x0)
      .attr("y", d => d.y0)
      .attr("height", d => d.y1 - d.y0)
      .attr("width", d => d.x1 - d.x0);

    // LABELS
    node.append("text")
  .attr("x", d => d.x0 - 6)
  .attr("y", d => (d.y1 + d.y0) / 2)
  .attr("dy", "0.35em")
  .attr("text-anchor", "end")
  .text(d => `${d.name} (${d.value})`)
  .filter(d => d.x0 < width / 2)
  .attr("x", d => d.x1 + 6)
  .attr("text-anchor", "start");
  }

  // -----------------------------
  // BUILD + RENDER BOTH
  // -----------------------------
  const issueCounts = buildCounts("issueArea", issueMap);
  const originCounts = buildCounts("caseOrigin", originMap);

  const issueGraph = buildSankey(issueCounts);
  const originGraph = buildSankey(originCounts);

  renderSankey(svgIssue, issueGraph);
  renderSankey(svgOrigin, originGraph);

});

</script>

</body>
</html>
